<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
	<meta name="baidu-site-verification" content="b9lOcChmbf">
	<title>Maintenance page</title>
	<style>
		* { box-sizing: border-box; }

		body {
			background-color: #080913;
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			margin: 0;
			padding: 2vh 0;
			min-height: 100vh;
			overflow: hidden;
			font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
		}

		.hi {
			display: flex;
			justify-content: center;
		}

		.hi h1 {
			font-size: clamp(1.6rem, 5vw, 3.4rem);
			color: #FFFFFF;
			text-shadow: 0px 0px 15px #B88;
			margin: 0 0 2.5vh 0;
			text-align: center;
		}

		.hi h2 {
			font-size: clamp(1rem, 2.4vw, 1.7rem);
			color: #FFFFFF;
			text-shadow: 0px 0px 15px #B88;
			margin: 1.2vh 0;
			white-space: nowrap;
		}

		.chat {
			display: flex;
			justify-content: center;
			border: solid 5px #0f0f8d;
			box-shadow: 0px 0px 20px #7eb3e9;
			width: min(70%, 1100px);
			height: 58vh;
			flex-direction: column;
		}

		.chatin {
			display: flex;
			justify-content: center;
			width: 100%;
			flex: 1 1 0;
			min-height: 0;
		}

		.charone {
			display: flex;
			justify-content: flex-start;
			align-items: flex-start;
			width: 100%;
		}

		.chartow {
			display: flex;
			justify-content: flex-end;
			align-items: flex-end;
			width: 100%;
		}

		.charone div,
		.chartow div {
			width: 2%;
			background: rgb(255, 255, 255);
			box-shadow: 0px 0px 2px #000000;
		}

		@media (max-width: 768px) {
			.chat { width: 92%; height: 50vh; }
		}
	</style>
	<script src="js/jquery.min.js"></script>
</head>

<body>
	<div class="hi">
		<h1>Maintenance page</h1>
	</div>
	<div class="chat">
		<div class="chatin">
			<div class="charone" id="d1">
			</div>
		</div>
		<div class="hi">
			<h2>In Reconstruction</h2>
		</div>
		<div class="chatin">
			<div class="chartow" id="d2">
			</div>
		</div>
	</div>
</body>
<script src="index.js"></script>

</html>
